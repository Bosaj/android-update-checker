name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Repository Integrity & Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Core Documentation
        run: |
          test -f README.md && echo "README.md verified"
          test -f LICENSE && echo "LICENSE verified"
          test -f CONTRIBUTING.md && echo "CONTRIBUTING.md verified"
          test -f CONTRIBUTORS.md && echo "CONTRIBUTORS.md verified"
          test -f SECURITY.md && echo "SECURITY.md verified"
          test -f CHANGELOG.md && echo "CHANGELOG.md verified"
