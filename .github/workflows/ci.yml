name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Documentation & Governance Standards
        run: |
          echo "Verifying repository governance standards..."
          for f in README.md LICENSE CONTRIBUTING.md CONTRIBUTORS.md SECURITY.md CHANGELOG.md; do
            test -f "$f" || { echo "::error::$f is missing"; exit 1; }
            echo "✓ $f present"
          done

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      # Each step fails the job on error: no "|| true".
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: update-radar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
